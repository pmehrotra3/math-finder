[project]
name = "mathfinder"
version = "0.1.0"
description = "Collaborative AI theorem prover: LaTeX in, verified Lean proof out."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import server.app` from the project root
markers = [
    "llm: calls a real LLM (slow, uses quota). Run with: pytest -m llm",
    "lean: runs Lean (first one waits for a REPL to load Mathlib). Skip with: pytest -m 'not lean and not llm'",
]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 120
extend-exclude = ["lean_env"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
