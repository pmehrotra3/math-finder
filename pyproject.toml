[project]
name = "mathfinder"
version = "0.1.0"
description = "An automated reasoning system: LaTeX in, machine-checked Lean 4 proof out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
mathfinder = "mathfinder.interface.cli:main"

[project.urls]
Repository = "https://github.com/pmehrotra3/math-finder"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: calls a real LLM (slow, uses quota). Run with: pytest -m llm",
    "lean: runs Lean. Skip with: pytest -m 'not lean and not llm'",
]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
