[project]
name = "mathfinder"
version = "0.1.0"
description = "Collaborative AI theorem prover: LaTeX in, verified Lean proof out."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: calls a real LLM (slow, uses quota). Run with: pytest -m llm",
]
addopts = "-m 'not llm'"
