<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Finder Guide</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel-2: #1c212a; --line: #2a303b;
    --text: #e6e8ec; --muted: #9aa3b2; --accent: #7cc4ff; --accent-2: #b59cff;
    --ok: #6fd39a; --warn: #f2c46d; --bad: #ff8a8a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 var(--sans); }
  a { color: var(--accent); }
  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
  nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel);
        border-right: 1px solid var(--line); padding: 20px 14px; }
  nav h1 { font-size: 17px; margin: 0 0 4px; }
  nav .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  nav a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px;
          color: var(--text); text-decoration: none; font-size: 14px; }
  nav a:hover { background: var(--panel-2); }
  nav a.active { background: var(--panel-2); color: var(--accent); }
  nav a .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  nav a.done .count { color: var(--ok); }
  main { padding: 32px 48px 120px; max-width: 980px; }
  section { padding-top: 12px; margin-bottom: 56px; border-bottom: 1px solid var(--line); padding-bottom: 32px; }
  h2 { font-size: 28px; margin: 0 0 8px; }
  h3 { font-size: 19px; margin: 28px 0 8px; color: var(--accent-2); }
  p, li { color: var(--text); }
  .why { background: var(--panel); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 6px; }
  .note { background: var(--panel); border-left: 3px solid var(--warn); padding: 10px 16px; border-radius: 6px; }
  code { font-family: var(--mono); font-size: 14px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  pre { position: relative; margin: 0; padding: 14px 16px; overflow-x: auto; background: #0b0d11;
        border: 1px solid var(--line); border-radius: 8px; }
  pre code { background: none; padding: 0; font-size: 13.5px; line-height: 1.55; }
  .code { margin: 10px 0; }
  .code-head { display: flex; justify-content: space-between; background: var(--panel-2);
               border: 1px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; padding: 6px 12px; }
  .code-head + pre { border-radius: 0 0 8px 8px; }
  .path { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .copy { position: absolute; top: 8px; right: 8px; background: var(--panel-2); color: var(--muted);
          border: 1px solid var(--line); border-radius: 6px; font-size: 12px; padding: 3px 9px; cursor: pointer; }
  .copy:hover { color: var(--text); }
  ol.steps { list-style: none; padding: 0; counter-reset: step; }
  ol.steps > li.step { counter-increment: step; position: relative; margin: 0 0 22px; padding: 14px 16px 14px 56px;
                       background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  ol.steps > li.step::before { content: counter(step); position: absolute; left: 14px; top: 14px; width: 28px; height: 28px;
                               border-radius: 50%; background: var(--panel-2); color: var(--accent);
                               display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  li.step .check { float: right; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  li.step.is-done { border-color: #2f5a42; }
  li.step.is-done::before { background: #1f3a2b; color: var(--ok); content: "✓"; }
  .explain { color: var(--muted); font-size: 15px; margin-top: 8px; }
  .explain strong { color: var(--text); }
  .checkpoint { background: #13201a; border: 1px solid #2f5a42; border-radius: 10px; padding: 14px 18px; }
  .checkpoint h3 { color: var(--ok); margin-top: 0; }
  .errors { background: #221616; border: 1px solid #5a2f2f; border-radius: 10px; padding: 14px 18px; margin-top: 12px; }
  .errors h3 { color: var(--bad); margin-top: 0; }
  .tree { font-family: var(--mono); font-size: 13.5px; white-space: pre; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--panel-2);
         color: var(--muted); border: 1px solid var(--line); }
  .tag.ok { color: var(--ok); border-color: #2f5a42; }
  .map svg { width: 100%; height: auto; display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; height: auto; }
    main { padding: 20px 16px 80px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav>
    <h1>Math Finder</h1>
    <div class="sub">Build it yourself, one step at a time</div>
    <div id="toc">
{{TOC}}
    </div>
  </nav>
  <main>
{{CHAPTERS}}
  </main>
</div>
<script>
(function () {
  // --- progress storage (may be unavailable in private windows) ---
  var KEY = "mathfinder-guide:";
  function load(id) { try { return localStorage.getItem(KEY + id) === "1"; } catch (e) { return false; } }
  function save(id, v) { try { localStorage.setItem(KEY + id, v ? "1" : "0"); } catch (e) {} }

  // --- copy button on every code block ---
  document.querySelectorAll("pre").forEach(function (pre) {
    var btn = document.createElement("button");
    btn.className = "copy"; btn.textContent = "Copy";
    btn.addEventListener("click", function () {
      var text = pre.querySelector("code") ? pre.querySelector("code").innerText : pre.innerText;
      function done() { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy"; }, 1200); }
      if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove();
      }
    });
    pre.appendChild(btn);
  });

  // --- a checkbox on every step, remembered per step ---
  document.querySelectorAll("section").forEach(function (sec) {
    sec.querySelectorAll("li.step").forEach(function (li, i) {
      var id = sec.id + "-" + (i + 1);
      var label = document.createElement("label"); label.className = "check";
      var box = document.createElement("input"); box.type = "checkbox"; box.checked = load(id);
      label.appendChild(box); label.appendChild(document.createTextNode("done"));
      li.insertBefore(label, li.firstChild);
      li.classList.toggle("is-done", box.checked);
      box.addEventListener("change", function () {
        save(id, box.checked); li.classList.toggle("is-done", box.checked); updateCounts();
      });
    });
  });

  // --- per-chapter progress in the sidebar ---
  function updateCounts() {
    document.querySelectorAll("#toc a").forEach(function (a) {
      var sec = document.getElementById(a.dataset.sec); if (!sec) return;
      var all = sec.querySelectorAll("li.step").length;
      var done = sec.querySelectorAll("li.step.is-done").length;
      var span = a.querySelector(".count");
      if (!span) { span = document.createElement("span"); span.className = "count"; a.appendChild(span); }
      span.textContent = all ? done + "/" + all : "";
      a.classList.toggle("done", all > 0 && done === all);
    });
  }
  updateCounts();

  // --- highlight the chapter you are reading ---
  var links = {};
  document.querySelectorAll("#toc a").forEach(function (a) { links[a.dataset.sec] = a; });
  var spy = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        Object.values(links).forEach(function (l) { l.classList.remove("active"); });
        if (links[e.target.id]) links[e.target.id].classList.add("active");
      }
    });
  }, { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll("section").forEach(function (s) { spy.observe(s); });
})();
</script>
</body>
</html>
